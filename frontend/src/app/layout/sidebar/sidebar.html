<aside class="sidebar" [class.collapsed]="!sidebarOpen">
  <img
    class="logo"
    src="assets/logos/_black_screen.jpg"
    alt="BLACK Logo"
    (click)="goToHome()"
    role="button"
    tabindex="0"
  />
  <p class="greeting">Hello, {{ firstname }} !</p>

  <ul class="sidebar-menu">
    <li [class.active]="isActive('/kanban')">
      <span class="material-symbols-outlined">widget_small</span> WIDGET 1
    </li>
    <li [class.active]="isActive('/archives')">
      <span class="material-symbols-outlined">inventory_2</span> WIDGET 2
    </li>
    <li [class.active]="isActive('/settings')">
      <span class="material-symbols-outlined">settings</span> WIDGET 3
    </li>
  </ul>

  <button class="logout-btn" (click)="onLogout()">
    <span class="material-symbols-outlined">logout</span>
    Log Out
  </button>

  <div class="sidebar-actions">
    <button class="toggle-btn" (click)="toggleSidebar()">
      @if (sidebarOpen) {
        <span class="material-symbols-outlined">keyboard_double_arrow_left</span>
      } @else {
        <span class="material-symbols-outlined">keyboard_double_arrow_right</span>
      }
    </button>

    @if (!sidebarOpen) {
      <ul class="icon-menu">
        <li [class.active]="isActive('/kanban')">
          <span class="material-symbols-outlined">widget_small</span>
        </li>
        <li [class.active]="isActive('/archives')">
          <span class="material-symbols-outlined">inventory_2</span>
        </li>
        <li [class.active]="isActive('/settings')">
          <span class="material-symbols-outlined">settings</span>
        </li>
      </ul>
    }
  </div>
</aside>
